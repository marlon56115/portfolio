image:
  repository: ghcr.io/marlon56115/portfolio
  tag: "0.1.1" # lo fija el HelmRelease de home-server
  pullPolicy: IfNotPresent

replicaCount: 1

# Prometheus del clúster (kube-prometheus-stack). Vacío = panel en vivo desactivado.
prometheusUrl: http://kps-prometheus.monitoring.svc.cluster.local:9090

service:
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
